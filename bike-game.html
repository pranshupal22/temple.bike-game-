<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Sprint — Bike Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101925;color:#f4f7fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.game{width:min(920px,96vw)}header{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.brand{font-size:clamp(20px,4vw,30px);font-weight:850;letter-spacing:.04em}.brand span{color:#b8f34b}.stats{display:flex;gap:18px;font-weight:700;color:#d2dce4}.stats b{color:#b8f34b}.frame{position:relative;overflow:hidden;border:2px solid #344558;border-radius:18px;background:#83cbe8;box-shadow:0 20px 70px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:900/540}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#10192599;text-align:center;padding:24px}.panel{max-width:440px;padding:26px 32px;border:1px solid #ffffff35;border-radius:18px;background:#111d2be8;box-shadow:0 16px 50px #0006}.panel h1{margin:0 0 8px;font-size:clamp(28px,6vw,46px)}.panel p{line-height:1.55;color:#d5e0e6;margin:8px 0 18px}.button{border:0;border-radius:999px;background:#b8f34b;color:#14200b;font-weight:900;font-size:16px;padding:12px 24px;cursor:pointer}.button:hover{background:#d0ff75}.hint{font-size:13px;color:#9fb0bd;margin-top:13px}.mobile{display:none;justify-content:center;gap:16px;margin-top:12px}.mobile button{background:#26384a;color:white;border:1px solid #506578;border-radius:14px;padding:12px 22px;font-size:21px;font-weight:800}@media(max-width:650px){.mobile{display:flex}.stats{gap:10px;font-size:13px}.frame{border-radius:12px}}
</style>
</head>
<body><main class="game"><header><div class="brand">STREET <span>SPRINT</span></div><div class="stats"><div>SCORE <b id="score">0</b></div><div>BEST <b id="best">0</b></div></div></header><div class="frame"><canvas id="game" width="900" height="540" aria-label="Bike racing game"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="title">Ready to ride?</h1><p id="message">Dodge the cones and roadblocks, collect stars, and see how far you can ride.</p><button class="button" id="start">START RIDING</button><div class="hint">Use ← → or A / D to steer · Space to jump</div></div></div></div><div class="mobile"><button id="left" aria-label="Steer left">←</button><button id="jump" aria-label="Jump">↑</button><button id="right" aria-label="Steer right">→</button></div></main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');
const W=900,H=540,lanes=[330,450,570];let state='ready',bike={lane:1,x:450,y:408,jump:0},objects=[],score=0,best=Number(localStorage.getItem('streetSprintBest')||0),speed=4,tick=0,keys={};bestEl.textContent=best;
function road(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#65747e');g.addColorStop(1,'#34434d');ctx.fillStyle='#9bdc82';ctx.fillRect(0,0,W,H);ctx.fillStyle='#7bc767';for(let y=0;y<H;y+=42){ctx.fillRect(25,y,15,23);ctx.fillRect(860,y+18,15,23)}ctx.fillStyle='#26333b';ctx.beginPath();ctx.moveTo(245,0);ctx.lineTo(655,0);ctx.lineTo(825,H);ctx.lineTo(75,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#e8e9d9';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(245,0);ctx.lineTo(75,H);ctx.moveTo(655,0);ctx.lineTo(825,H);ctx.stroke();ctx.strokeStyle='#ffffff88';ctx.lineWidth=4;let off=(tick*speed*2)%90;for(let x of [382,518]){for(let y=-90+off;y<H;y+=90){ctx.beginPath();ctx.moveTo(450+(x-450)*.34+(x-450)*(y/H)*.67,y);ctx.lineTo(450+(x-450)*.34+(x-450)*((y+42)/H)*.67,y+42);ctx.stroke()}}ctx.fillStyle='#d4e6e9';ctx.fillRect(0,0,W,12)}
function drawBike(x,y,jump){ctx.save();ctx.translate(x,y-jump);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,30,30,8,0,0,7);ctx.fill();ctx.strokeStyle='#171c22';ctx.lineWidth=7;ctx.beginPath();ctx.arc(-19,15,12,0,7);ctx.arc(19,15,12,0,7);ctx.stroke();ctx.strokeStyle='#b8f34b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-19,15);ctx.lineTo(-5,-3);ctx.lineTo(4,15);ctx.lineTo(19,15);ctx.lineTo(4,-4);ctx.lineTo(-5,-3);ctx.stroke();ctx.fillStyle='#f0a45d';ctx.beginPath();ctx.arc(0,-21,9,0,7);ctx.fill();ctx.strokeStyle='#e9f2f4';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,0);ctx.lineTo(-8,11);ctx.moveTo(0,0);ctx.lineTo(11,9);ctx.stroke();ctx.fillStyle='#ff754e';ctx.beginPath();ctx.arc(0,5,5,0,7);ctx.fill();ctx.restore()}
function drawObstacle(o){ctx.save();ctx.translate(o.x,o.y);if(o.type==='star'){ctx.fillStyle='#ffdc4a';ctx.strokeStyle='#fff4b0';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?11:22;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}else if(o.type==='cone'){ctx.fillStyle='#ff754e';ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(20,18);ctx.lineTo(-20,18);ctx.closePath();ctx.fill();ctx.fillStyle='#fff2d9';ctx.fillRect(-11,3,22,5);ctx.fillStyle='#303c42';ctx.fillRect(-24,18,48,6)}else{ctx.fillStyle='#d65a57';ctx.fillRect(-27,-17,54,35);ctx.fillStyle='#f4c65d';ctx.fillRect(-18,-9,36,5);ctx.fillRect(-18,2,36,5)}ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);road();for(const o of objects)drawObstacle(o);drawBike(bike.x,bike.y,bike.jump);if(state==='running'){tick++;speed=4+Math.min(score/180,4);if(tick%42===0){let lane=Math.floor(Math.random()*3),r=Math.random();objects.push({x:lanes[lane],y:-25,type:r<.18?'star':r<.68?'cone':'block'})}for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.y+=speed*(o.type==='star'?0.95:1);if(o.y>H+30){objects.splice(i,1);continue}if(Math.abs(o.x-bike.x)<34&&Math.abs(o.y-(bike.y-5))<34){if(o.type==='star'){score+=25;objects.splice(i,1)}else if(bike.jump<18){endGame();break}}}if(state==='running'){score+=.09;scoreEl.textContent=Math.floor(score)}}requestAnimationFrame(render)}
function start(){state='running';tick=0;score=0;speed=4;objects=[];bike={lane:1,x:450,y:408,jump:0};scoreEl.textContent='0';overlay.style.display='none'}function endGame(){state='over';let final=Math.floor(score);if(final>best){best=final;localStorage.setItem('streetSprintBest',best);bestEl.textContent=best}document.querySelector('#title').textContent='Ride over!';document.querySelector('#message').textContent=`You scored ${final}. Want another run?`;document.querySelector('#start').textContent='RIDE AGAIN';overlay.style.display='grid'}
function steer(n){if(state!=='running')return;bike.lane=Math.max(0,Math.min(2,bike.lane+n));bike.x=lanes[bike.lane]}function jump(){if(state==='running'&&bike.jump===0){bike.jump=95;let t=setInterval(()=>{bike.jump=Math.max(0,bike.jump-5);if(!bike.jump)clearInterval(t)},25)}}
document.querySelector('#start').onclick=start;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer(1);if(e.key==='ArrowUp'||e.key===' ')jump();if((e.key==='Enter')&&(state!=='running'))start()});document.querySelector('#left').onclick=()=>steer(-1);document.querySelector('#right').onclick=()=>steer(1);document.querySelector('#jump').onclick=jump;render();
})();
</script></body></html>
